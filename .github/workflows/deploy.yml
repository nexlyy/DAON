name: Redirect GitHub Pages to daon.pl

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write a page that forwards every address to daon.pl
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <title>DAON — Korean Restaurant in Katowice</title>
              <meta name="robots" content="noindex" />
              <link rel="canonical" href="https://daon.pl/" />
              <meta http-equiv="refresh" content="0; url=https://daon.pl/" />
              <script>
                var path = location.pathname.replace(/^\/DAON/, '') || '/'
                location.replace('https://daon.pl' + path + location.search + location.hash)
              </script>
            </head>
            <body>
              <p>DAON has moved to <a href="https://daon.pl/">daon.pl</a>.</p>
            </body>
          </html>
          HTML
          cp site/index.html site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
