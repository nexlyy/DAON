# daon.pl — the site, and the reservation API behind /api/.
#
# One domain for both means the browser makes same-origin calls: no CORS, no
# second certificate, and a short address to print on a table.
#
# Goes in /etc/nginx/sites-available/daon.pl, symlinked from sites-enabled.
# Certbot rewrites the listen lines and adds the certificate paths when it runs.

server {
    listen 80;
    listen [::]:80;
    server_name daon.pl www.daon.pl;

    # Certbot renews over HTTP, so this has to answer before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://daon.pl$request_uri;
    }
}

# www goes to the bare domain: one address in Google's index, one in the tab.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.daon.pl;

    ssl_certificate     /etc/letsencrypt/live/daon.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daon.pl/privkey.pem;

    return 301 https://daon.pl$request_uri;
}

# Pages are prerendered HTML that names hashed assets, and a deploy deletes the
# old assets. A browser left to guess how long to keep a page would load one
# that points at files which are gone, so every HTML response says no-cache.
map $sent_http_content_type $daon_html_cache {
    default "";
    ~^text/html "no-cache";
}

# A second line behind the API's own limit: POSTs to the API from one address
# are capped here before they reach Node. An empty key is not counted, so page
# loads and availability checks pass untouched.
map $request_method $daon_api_writer {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $daon_api_writer zone=daon_api_posts:10m rate=20r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daon.pl;

    ssl_certificate     /etc/letsencrypt/live/daon.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daon.pl/privkey.pem;

    root /var/www/daon;
    index index.html;

    # nginx does not merge add_header: a location that sets one of its own
    # replaces the whole inherited set. Any location below that adds a header
    # has to repeat these, or that response goes out bare.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $daon_html_cache;

    # Every real page is a file now, so anything else is a true 404 with the
    # site's own page, not the home page answering 200 under a wrong address.
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # The reservation API. Same origin as the page that calls it.
    location /api/ {
        limit_req zone=daon_api_posts burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Hashed file names, so they can be cached for as long as a browser likes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Photographs change only when the menu does, and they are the bulk of the
    # page weight.
    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # The drinks menu, which is not public until the bar opens. It sits outside
    # the site directory so a deploy cannot take it down or put it up, and the
    # unguessable segment in the path is what opens it: whoever holds the link
    # holds the menu, so treat it as unlisted rather than protected.
    location ^~ /d/ {
        alias /var/www/daon-private/;
        autoindex off;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, max-age=600";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # The page that reads it. The rewrite ends with break so the shell is served
    # from inside this location: handing it over as a try_files fallback re-runs
    # location = /index.html, whose own add_header set replaces this one and
    # drops the very header that keeps the address out of the index.
    location ~ ^/(?:en/|ko/)?drinks/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        rewrite ^ /shell.html break;
    }

    # The shell must not be cached hard or a deploy takes a day to show up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Polish lives at the root and English and Korean under /en and /ko, so a
    # /pl address someone types or shares goes to the page it means.
    location = /pl {
        return 301 /;
    }

    location ^~ /pl/ {
        rewrite ^/pl/(.*)$ /$1 permanent;
    }

    # Each route is its own prerendered file; no trailing-slash redirects.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    location ~ /\.(ht|git|env) {
        deny all;
        return 404;
    }
}
