# daon.pl — the site, and the reservation API behind /api/.
#
# One domain for both means the browser makes same-origin calls: no CORS, no
# second certificate, and a short address to print on a table.
#
# Goes in /etc/nginx/sites-available/daon.pl, symlinked from sites-enabled.
# Certbot rewrites the listen lines and adds the certificate paths when it runs.

server {
    listen 80;
    listen [::]:80;
    server_name daon.pl www.daon.pl;

    # Certbot renews over HTTP, so this has to answer before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://daon.pl$request_uri;
    }
}

# www goes to the bare domain: one address in Google's index, one in the tab.
server {
    listen 443 ssl;
    http2 on;
    server_name www.daon.pl;

    ssl_certificate     /etc/letsencrypt/live/daon.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daon.pl/privkey.pem;

    return 301 https://daon.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name daon.pl;

    ssl_certificate     /etc/letsencrypt/live/daon.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daon.pl/privkey.pem;

    root /var/www/daon;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # The reservation API. Same origin as the page that calls it.
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Hashed file names, so they can be cached for as long as a browser likes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Photographs change only when the menu does, and they are the bulk of the
    # page weight.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # The shell must not be cached hard or a deploy takes a day to show up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(ht|git|env) {
        deny all;
        return 404;
    }
}
